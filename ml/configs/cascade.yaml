# Konfigurasi CascadeEngine (Track A BirdNET + Track B classifier).
# Dibaca oleh ml/engines/cascade.py.
#
# NILAI INI SETARA PERILAKU LR v3 DI COMMIT 07947bc (sebelum T4).
# Saat itu belum ada cascade.yaml, jadi nilai-nilai ini adalah
# default muat_konfigurasi() + konstanta hardcoded di cascade.py.
# Jangan diubah tanpa lewat gerbang G lewat ml/promosikan.py.
# Kebijakan eksperimental disimpan di ml/configs/kandidat/.

# Ambang minimum BirdNET untuk spesies NON-TARGET (di luar 25 spesies lokal).
ambang_birdnet_nontarget: 0.1

# Kalau true, deteksi Track B hanya diterima bila spesies yang sama juga
# terdeteksi BirdNET (konfirmasi silang).
trackb_wajib_birdnet: false

# Margin antara keyakinan top-1 dan top-2 Track B. 0.0 = tidak ada margin.
margin_top1_top2: 0.0

# Skor energi sebagai penolak.
pakai_energi: false
ambang_energi: 0.0

# Penyaring deteksi lemah (hardcoded di cascade.py sejak 07947bc):
# deteksi keyakinan < 0.5 harus muncul >= 2 kali dalam satu rekaman.
min_kemunculan_ulang: 2
ambang_kuat: 0.5